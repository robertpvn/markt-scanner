name: Wekelijkse cryptoscan

on:
  schedule:
    # Elke maandag 07:30 UTC (09:30 NL-tijd in de zomer), na de weeksluiting van zondag 23:59 UTC
    - cron: '30 7 * * 1'
  workflow_dispatch: {}     # handmatig starten via de Actions-tab
  push:
    branches: [main, master]
    paths: ['crypto_scanner.py', 'requirements.txt', '.github/workflows/crypto.yml']

permissions:
  contents: write
  issues: write

concurrency:
  group: cryptoscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: Cryptoscan draaien
        run: python crypto_scanner.py

      - name: Resultaten opslaan in de repo
        run: |
          git config user.name "markt-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data CRYPTO_REPORT.md
          git diff --cached --quiet || git commit -m "Cryptoscan $(date -u +%F)"
          git pull --rebase --autostash || true
          git push

      - name: Melding (GitHub-issue) bij signalen
        if: ${{ hashFiles('data/crypto/alert.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat data/crypto/alert_title.txt)" \
            --body-file data/crypto/alert.md
