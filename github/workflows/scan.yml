name: Wekelijkse marktscan

on:
  schedule:
    # Elke zaterdag 07:30 UTC (09:30 NL-tijd in de zomer), na sluiting VS-beurs op vrijdag
    - cron: '30 7 * * 6'
  workflow_dispatch: {}     # handmatig starten via de Actions-tab
  push:
    branches: [main, master]
    paths: ['scanner.py', 'requirements.txt', '.github/workflows/scan.yml']

permissions:
  contents: write
  issues: write

concurrency:
  group: marktscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: Scan draaien
        run: python scanner.py

      - name: Resultaten opslaan in de repo
        run: |
          git config user.name "markt-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data REPORT.md
          git diff --cached --quiet || git commit -m "Scan $(date -u +%F)"
          git push

      - name: Melding (GitHub-issue) bij signalen
        if: ${{ hashFiles('data/alert.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat data/alert_title.txt)" \
            --body-file data/alert.md
